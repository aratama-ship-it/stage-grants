# 日次リビルド＋Pages配信: main への push・毎日 03:xx JST・手動の3経路で build → test → deploy-pages。
# 締切超過の自動降格は build.mjs がビルド時にメモリ上で判定する（data/*.json は変更しない）。
name: Build and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "5 18 * * *" # 03:05 JST
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.repository }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Prepare artifact directory
        run: |
          mkdir -p _site
          cp -R assets _site/assets
          cp CNAME _site/CNAME

      - name: Build
        env:
          BUILD_OUTPUT_DIR: _site
          BUILD_SHA: ${{ github.sha }}
        run: node build.mjs

      - name: Test
        run: node --test tests/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
